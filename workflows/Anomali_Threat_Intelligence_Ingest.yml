name: Anomali Threat Intelligence Ingest
description: Anomali ThreatStream IOC ingestion - parallel per-type execution
parameters: {}
provision_on_install: true
trigger:
    next:
        - CreateVariable
    event: Schedule
    schedule:
        time_cycle: 0 0/1 * * *
        start_date: ""
        end_date: ""
        tz: Etc/UTC
        skip_concurrent: true
actions:
    # Single variable with per-type pagination tokens
    CreateVariable:
        next:
            - IngestIP
            - IngestDomain
            - IngestURL
            - IngestEmail
            - IngestHash
        id: 702d15788dbbffdf0b68d8e2f3599aa4
        class: CreateVariable
        properties:
            variable_schema:
                properties:
                    next_ip:
                        type: string
                    next_domain:
                        type: string
                    next_url:
                        type: string
                    next_email:
                        type: string
                    next_hash:
                        type: string
                type: object
        version_constraint: ~1

    # ===== IP Branch =====
    IngestIP:
        next:
            - UpdateVariableIP
        id: functions.anomali-ioc-ingest.Anomali Ingest
        properties:
            fail_fast_enabled: false
            limit: 1000
            repository: search-all
            status: active
            type: ip
        version_constraint: ~0
    UpdateVariableIP:
        next:
            - LoopIP
        id: 6c6eab39063fa3b72d98c82af60deb8a
        class: UpdateVariable
        properties:
            WorkflowCustomVariable:
                next_ip: ${data['IngestIP.FaaS.anomali-ioc-ingest.AnomaliIngest.next']}
        version_constraint: ~1

    # ===== Domain Branch =====
    IngestDomain:
        next:
            - UpdateVariableDomain
        id: functions.anomali-ioc-ingest.Anomali Ingest
        properties:
            fail_fast_enabled: false
            limit: 1000
            repository: search-all
            status: active
            type: domain
        version_constraint: ~0
    UpdateVariableDomain:
        next:
            - LoopDomain
        id: 6c6eab39063fa3b72d98c82af60deb8a
        class: UpdateVariable
        properties:
            WorkflowCustomVariable:
                next_domain: ${data['IngestDomain.FaaS.anomali-ioc-ingest.AnomaliIngest.next']}
        version_constraint: ~1

    # ===== URL Branch =====
    IngestURL:
        next:
            - UpdateVariableURL
        id: functions.anomali-ioc-ingest.Anomali Ingest
        properties:
            fail_fast_enabled: false
            limit: 1000
            repository: search-all
            status: active
            type: url
        version_constraint: ~0
    UpdateVariableURL:
        next:
            - LoopURL
        id: 6c6eab39063fa3b72d98c82af60deb8a
        class: UpdateVariable
        properties:
            WorkflowCustomVariable:
                next_url: ${data['IngestURL.FaaS.anomali-ioc-ingest.AnomaliIngest.next']}
        version_constraint: ~1

    # ===== Email Branch =====
    IngestEmail:
        next:
            - UpdateVariableEmail
        id: functions.anomali-ioc-ingest.Anomali Ingest
        properties:
            fail_fast_enabled: false
            limit: 1000
            repository: search-all
            status: active
            type: email
        version_constraint: ~0
    UpdateVariableEmail:
        next:
            - LoopEmail
        id: 6c6eab39063fa3b72d98c82af60deb8a
        class: UpdateVariable
        properties:
            WorkflowCustomVariable:
                next_email: ${data['IngestEmail.FaaS.anomali-ioc-ingest.AnomaliIngest.next']}
        version_constraint: ~1

    # ===== Hash Branch (produces md5, sha1, sha256 files) =====
    IngestHash:
        next:
            - UpdateVariableHash
        id: functions.anomali-ioc-ingest.Anomali Ingest
        properties:
            fail_fast_enabled: false
            limit: 1000
            repository: search-all
            status: active
            type: hash
        version_constraint: ~0
    UpdateVariableHash:
        next:
            - LoopHash
        id: 6c6eab39063fa3b72d98c82af60deb8a
        class: UpdateVariable
        properties:
            WorkflowCustomVariable:
                next_hash: ${data['IngestHash.FaaS.anomali-ioc-ingest.AnomaliIngest.next']}
        version_constraint: ~1

loops:
    # ===== IP Pagination Loop =====
    LoopIP:
        display: While next_ip exists and is not 0
        for:
            input: ""
            condition: WorkflowCustomVariable.next_ip:!null+WorkflowCustomVariable.next_ip:!'0'
            condition_display:
                - next_ip exists
                - next_ip is not equal to 0
            continue_on_partial_execution: false
            max_execution_seconds: 3300
            max_iteration_count: 200
            sequential: true
        trigger:
            next:
                - IngestIP2
        actions:
            IngestIP2:
                next:
                    - UpdateVariableIP2
                id: functions.anomali-ioc-ingest.Anomali Ingest
                properties:
                    fail_fast_enabled: false
                    limit: 1000
                    next: ${data['WorkflowCustomVariable.next_ip']}
                    repository: search-all
                    status: active
                    type: ip
                version_constraint: ~0
            UpdateVariableIP2:
                id: 6c6eab39063fa3b72d98c82af60deb8a
                class: UpdateVariable
                properties:
                    WorkflowCustomVariable:
                        next_ip: ${data['IngestIP2.FaaS.anomali-ioc-ingest.AnomaliIngest.next']}
                version_constraint: ~1

    # ===== Domain Pagination Loop =====
    LoopDomain:
