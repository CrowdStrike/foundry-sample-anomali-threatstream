    # ===== Email Pagination Loop =====
    LoopEmail:
        display: While next_email exists and is not 0
        for:
            input: ""
            condition: WorkflowCustomVariable.next_email:!null+WorkflowCustomVariable.next_email:!'0'
            condition_display:
                - next_email exists
                - next_email is not equal to 0
            continue_on_partial_execution: false
            max_execution_seconds: 3300
            max_iteration_count: 200
            sequential: true
        trigger:
            next:
                - IngestEmail2
        actions:
            IngestEmail2:
                next:
                    - UpdateVariableEmail2
                id: functions.anomali-ioc-ingest.Anomali Ingest
                properties:
                    fail_fast_enabled: false
                    limit: 1000
                    next: ${data['WorkflowCustomVariable.next_email']}
                    repository: search-all
                    status: active
