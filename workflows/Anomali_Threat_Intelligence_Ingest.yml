                        next_email: ${data['IngestEmail2.FaaS.anomali-ioc-ingest.AnomaliIngest.next']}
                version_constraint: ~1

    # ===== Hash Pagination Loop (handles md5, sha1, sha256) =====
    LoopHash:
        display: While next_hash exists and is not 0
        for:
            input: ""
            condition: WorkflowCustomVariable.next_hash:!null+WorkflowCustomVariable.next_hash:!'0'
            condition_display:
