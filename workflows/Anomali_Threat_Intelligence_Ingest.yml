name: Anomali Threat Intelligence Ingest
description: Anomali ThreatStream IOC ingestion - parallel per-type execution
parameters: {}
provision_on_install: true
trigger:
    next:
        - IngestIP
        - IngestDomain
        - IngestURL
        - IngestEmail
        - IngestHash
    event: Schedule
    schedule:
        time_cycle: 0 0/1 * * *
        start_date: ""
        end_date: ""
        tz: Etc/UTC
        skip_concurrent: true
actions:
    # ===== IP Branch =====
    IngestIP:
        name: Anomali Ingest ip
        id: functions.anomali-ioc-ingest.Anomali Ingest
        properties:
            fail_fast_enabled: false
            confidence_gte: 90
            limit: 1000
            repository: search-all
            status: active
            type: ip
        version_constraint: ~0

    # ===== Domain Branch =====
    IngestDomain:
        name: Anomali Ingest domain
        id: functions.anomali-ioc-ingest.Anomali Ingest
        properties:
            fail_fast_enabled: false
            confidence_gte: 90
            limit: 1000
            repository: search-all
            status: active
            type: domain
        version_constraint: ~0

    # ===== URL Branch =====
    IngestURL:
        name: Anomali Ingest url
        id: functions.anomali-ioc-ingest.Anomali Ingest
        properties:
            fail_fast_enabled: false
            confidence_gte: 90
            limit: 1000
            repository: search-all
            status: active
            type: url
        version_constraint: ~0

    # ===== Email Branch =====
    IngestEmail:
        name: Anomali Ingest email
        id: functions.anomali-ioc-ingest.Anomali Ingest
        properties:
            fail_fast_enabled: false
            confidence_gte: 90
            limit: 1000
            repository: search-all
            status: active
            type: email
        version_constraint: ~0

    # ===== Hash Branch (produces md5, sha1, sha256 files) =====
    IngestHash:
        name: Anomali Ingest hash
        id: functions.anomali-ioc-ingest.Anomali Ingest
        properties:
            fail_fast_enabled: false
            confidence_gte: 90
            limit: 1000
            repository: search-all
            status: active
            type: hash
        version_constraint: ~0