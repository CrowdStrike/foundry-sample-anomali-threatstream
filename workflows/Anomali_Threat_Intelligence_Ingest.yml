                class: UpdateVariable
                properties:
                    WorkflowCustomVariable:
                        next_domain: ${data['IngestDomain2.FaaS.anomali-ioc-ingest.AnomaliIngest.next']}
                version_constraint: ~1

    # ===== URL Pagination Loop =====
    LoopURL:
        display: While next_url exists and is not 0
        for:
            input: ""
            condition: WorkflowCustomVariable.next_url:!null+WorkflowCustomVariable.next_url:!'0'
            condition_display:
                - next_url exists
                - next_url is not equal to 0
            continue_on_partial_execution: false
            max_execution_seconds: 3300
            max_iteration_count: 200
            sequential: true
        trigger:
            next:
                - IngestURL2
        actions:
            IngestURL2:
                next:
                    - UpdateVariableURL2
                id: functions.anomali-ioc-ingest.Anomali Ingest
                properties:
                    fail_fast_enabled: false
                    limit: 1000
                    next: ${data['WorkflowCustomVariable.next_url']}
                    repository: search-all
                    status: active
                    type: url
                version_constraint: ~0
            UpdateVariableURL2:
                id: 6c6eab39063fa3b72d98c82af60deb8a
                class: UpdateVariable
                properties:
                    WorkflowCustomVariable:
