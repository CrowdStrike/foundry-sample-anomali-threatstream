name: Sample CI
on: [ push, pull_request ]

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: functions/anomali-ioc-ingest/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        working-directory: functions/anomali-ioc-ingest

      - name: Run Python tests
        run: |
          if [ -f "test_main.py" ]; then
            echo "Running Python tests"
            python -m pytest test_main.py -v
          else
            echo "No test_main.py found, skipping Python tests"
          fi
        working-directory: functions/anomali-ioc-ingest

      - name: Setup Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c  # v6.1.0
        with:
          go-version: '1.26.x'

      - name: Install Go dependencies
        run: |
          if [ -f "go.mod" ]; then
            go get .
          fi
        working-directory: functions/anomali-ioc-ingest

      - name: Run Go tests
        run: |
          if [ -f "go.mod" ]; then
            echo "Running Go tests"
            go test -v ./...
          else
            echo "No go.mod found, skipping Go tests"
          fi
        working-directory: functions/anomali-ioc-ingest

      - name: Verify Go function builds
        run: |
          if [ -f "go.mod" ]; then
            echo "Building Go function"
            go build -o /dev/null .
            echo "✅ Go function builds successfully"
          else
            echo "No go.mod found, skipping Go build"
          fi
        working-directory: functions/anomali-ioc-ingest

  code-lint:
    name: Code lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          fetch-depth: 0
      - name: Run Validation
        id: trufflehog
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace \
            ghcr.io/trufflesecurity/trufflehog:latest \
            git file:///workspace/ --branch HEAD \
            --config=.github/custom_detectors.yaml --no-verification \
            --exclude-paths=.github/detector-exclude-paths.txt \
            --results=verified,unknown,unverified --json --no-update --fail \
            > trufflehog-results.json 2>/dev/null
        continue-on-error: true
      - name: Validation summary
        if: steps.trufflehog.outcome == 'failure'
        run: |
          echo "## Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| # | Detector | File | Line | Commit |" >> $GITHUB_STEP_SUMMARY
          echo "|---|----------|------|------|--------|" >> $GITHUB_STEP_SUMMARY
          jq -r 'select(.SourceMetadata) | "\(if .DetectorName == "CustomRegex" then (.ExtraData.name // "CustomRegex") else .DetectorName end) | \(.SourceMetadata.Data.Git.file) | L\(.SourceMetadata.Data.Git.line) | \(.SourceMetadata.Data.Git.commit)"' trufflehog-results.json | sort -u | awk '{printf "| %d | %s |\n", NR, $0}' >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Validation findings - failing build." >> $GITHUB_STEP_SUMMARY
      - name: Fail on validation findings
        if: steps.trufflehog.outcome == 'failure'
        run: exit 1
